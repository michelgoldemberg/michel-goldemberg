name: Atualizar Portal Michel Goldemberg

on:
  schedule:
    # 13:00 UTC = 10:00 em Brasília (UTC-3).
    # O cron do GitHub roda em UTC e pode atrasar alguns minutos em horário de pico.
    - cron: "0 13 * * *"
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install anthropic

      - name: Gerar o portal do dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gerar_portal.py

      - name: Publicar index.html no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Portal atualizado: $(date -u +'%Y-%m-%d')" || echo "Sem mudanças"
          git push

  deploy:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório (com index.html novo)
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
